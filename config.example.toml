# SeavxBot configuration template.
# Copy this file to config.toml and fill in your own values.
# config.toml is gitignored so your number never reaches the repository.
bot_name = "SeavxBot"

# Command prefixes (supports multiple prefixes, e.g. ["!", ".", "#", "/"])
prefixes = ["!", ".", "#", "/"]

# Owner WhatsApp phone numbers (with country code, digits only)
owners = [
  "628123456789"
]

[auth]
dir = "auth_info"
# Default method when not registered: "pairing" or "qr" (leave empty to ask interactively)
default_method = ""
# Phone number for pairing code (if default_method is "pairing")
phone_number = ""

[logging]
# Pino logger level: "fatal" | "error" | "warn" | "info" | "debug" | "trace"
level = "warn"

[storage]
# SQLite file holding per-group settings. Created on first run.
path = "data/seavxbot.db"

[features]
# Automatically mark incoming messages as read (blue tick / ACK)
read_message = true

[device_info]
# Address a user's phone opens the .deviceinfo link at. Leave empty to use the
# machine's LAN IP, which only works for users on the same network.
public_url = ""
# Port the device-link server listens on.
port = 3000

[schedule]
# Default local times for the nightly close/open. A group opts in with
# !settings autoclose on / !settings autoopen on and may override the times.
auto_close_time = "23:00"
auto_open_time = "06:00"

[download]
# yt-dlp is required for the YouTube and Instagram downloaders.
# Simplest form: one binary on PATH.
ytdlp_path = "yt-dlp"
# Optional argv prefix, used instead of ytdlp_path when set. Useful when the
# launcher is blocked by policy but the Python module still runs:
#   ytdlp_command = ["python", "-m", "yt_dlp"]
# Optional: ffmpeg executable or directory, needed to merge video + audio.
# Leave empty to let yt-dlp find it on PATH.
ffmpeg_path = ""
# Highest resolution attempted. Lower rungs are tried automatically when a
# download would exceed WhatsApp's 64 MB media limit.
max_height = 720
# Wall-clock budget for a single download attempt, in seconds.
timeout_seconds = 180
# Font used for the brat sticker. Leave empty to auto-detect Arial Narrow
# (ARIALN.TTF on Windows, DejaVu Sans on Linux, Arial Narrow on macOS).
sticker_font = ""

[messages]
owner_only = "🚩 This command is reserved for the bot owner."
admin_only = "🚩 Group admin privileges required."
group_only = "🚩 This command can only be used in groups."
bot_admin_only = "🚩 Bot requires admin privileges to perform this action."
error = "🚩 An error occurred while executing the command."

# Default greeting templates. A group can override these with
# !settings welcometext / !settings goodbyetext.
# Placeholders: {mention} {name} {group} {count}
welcome_text = "Welcome {mention} to *{group}*! You are member #{count}."
goodbye_text = "Goodbye {name}."
